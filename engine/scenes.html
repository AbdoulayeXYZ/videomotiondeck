<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:VMD;src:url(../assets/fonts/Montserrat-500.ttf);font-weight:500}
@font-face{font-family:VMD;src:url(../assets/fonts/Montserrat-700.ttf);font-weight:700}
@font-face{font-family:VMD;src:url(../assets/fonts/Montserrat-800.ttf);font-weight:800}
:root{--bg:#020D19;--bg2:#0A2236;--accent:#00C8BE;--accent2:#FFE500;--alert:#FF4545;--text:#FFFFFF;--muted:#B9C6D3;--font:VMD}
html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:transparent;font-family:var(--font),VMD,Montserrat,Arial,sans-serif;color:var(--text)}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:hidden}
.full{position:absolute;left:0;top:0;width:1920px;height:1080px}
.a{position:absolute}
.mask{position:absolute;overflow:hidden;padding-bottom:6px}
.mask>.in{display:inline-block;white-space:nowrap;will-change:transform}
.eyebrow{font-size:26px;font-weight:700;letter-spacing:8px;color:var(--accent);text-transform:uppercase;white-space:nowrap}
.big{font-weight:800;letter-spacing:-0.035em;line-height:1.02;white-space:nowrap}
.sub{font-size:34px;font-weight:500;color:var(--muted);line-height:1.35}
.src{font-size:23px;font-weight:500;color:var(--muted);opacity:.95;letter-spacing:.5px}
.acc{color:var(--accent)}.acc2{color:var(--accent2)}.alert{color:var(--alert)}
.grid{position:absolute;inset:-120px;background-image:linear-gradient(color-mix(in srgb,var(--accent) 5%,transparent) 1px,transparent 1px),linear-gradient(90deg,color-mix(in srgb,var(--accent) 5%,transparent) 1px,transparent 1px);background-size:80px 80px}
.glow{position:absolute;inset:0;background:radial-gradient(ellipse at 72% 45%,color-mix(in srgb,var(--accent) 16%,transparent) 0%,transparent 58%)}
.card{position:absolute;border-radius:22px;background:linear-gradient(160deg,color-mix(in srgb,var(--bg2) 96%,transparent),color-mix(in srgb,var(--bg) 97%,transparent));border:1.5px solid color-mix(in srgb,var(--accent) 45%,transparent);box-shadow:0 40px 100px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.07)}
.pill{position:absolute;height:84px;margin-top:-42px;border-radius:999px;padding:0 34px 0 86px;display:flex;align-items:center;font-size:30px;font-weight:800;white-space:nowrap;background:color-mix(in srgb,var(--bg) 96%,transparent);border:1.5px solid color-mix(in srgb,var(--accent) 55%,transparent);box-shadow:0 18px 50px rgba(0,0,0,.5)}
.pill svg{position:absolute;left:22px;top:18px}
.node{position:absolute;width:300px;height:140px;margin-left:-150px;margin-top:-70px;border-radius:20px;background:linear-gradient(160deg,var(--bg2),var(--bg));border:1.5px solid color-mix(in srgb,var(--accent) 50%,transparent);box-shadow:0 24px 60px rgba(0,0,0,.5)}
.node .n{position:absolute;left:24px;top:18px;font-size:18px;font-weight:800;letter-spacing:3px;color:var(--accent)}
.node .t{position:absolute;left:24px;top:48px;right:18px;font-size:27px;font-weight:800;white-space:nowrap}
.node .s{position:absolute;left:24px;top:90px;right:18px;font-size:21px;font-weight:500;color:var(--muted);white-space:nowrap}
.badge{position:absolute;height:76px;border-radius:16px;padding:0 30px;display:flex;align-items:center;gap:14px;font-size:30px;font-weight:800;white-space:nowrap}
.dot{position:absolute;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;border:3px solid var(--accent);display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:800}
.chip{display:inline-block;padding:9px 16px 8px;border-radius:8px;font-weight:800;font-size:22px;letter-spacing:3px;white-space:nowrap;color:var(--bg);background:var(--accent)}
</style></head>
<body><div id="stage"></div>
<script src="scenes.js"></script>
</body></html>
